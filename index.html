<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger</title>
<meta name="description" content="Private ledger for loans and your own money.">
<meta name="theme-color" content="#12100E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script>
  // Paint the correct theme before first render, before Firestore responds.
  (function () {
    var t = localStorage.getItem("ledger:theme") || "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>
  <div id="root" class="app-shell">
    <div class="boot-spinner" aria-label="Loading"><span class="spinner"></span></div>
  </div>
  <div id="toast-root" class="toast-root"></div>
  <div id="sheet-root"></div>
  <script type="module" src="js/app.js?devcachebust=5"></script>
</body>
</html>
